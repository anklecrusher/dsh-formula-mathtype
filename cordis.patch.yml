# Registers the formula-mathtype host plugin.
#
# One formula pipeline:
#   clipboard screenshot -> SimpleTex formula OCR -> LaTeX (normalized)
#   -> injector/MathTypeInjector.exe -> real MathType OLE object (Equation.DSMT4)
#   inserted at the caret of the active Word document, or on the current
#   PowerPoint slide (target=ppt).
#
# Requirements on this machine: MathType 7 installed (Equation.DSMT4 registered),
# Microsoft Word and/or PowerPoint desktop, Python with requests + Pillow + numpy, and the .NET
# Framework compiler (csc.exe, ships with Windows) used to build the injector.
- insert:
    - id: formula-mathtype
      name: '@local/dsh-formula-mathtype'
      config:
        # Leave these empty to use the portable defaults (recommended, especially
        # when the repository is cloned onto another machine):
        #   pythonPath: auto-detect (env DSH_FORMULA_PYTHON/PYTHON, common install
        #               dirs, then this repo author's D:/Program Files/python.exe)
        #   tokenFile:  %LOCALAPPDATA%\dsh-formula-mathtype\simpletex.token
        # Uncomment and set only if auto-detection does not find your interpreter.
        pythonPath: ''
        tokenFile: ''
        # standard = 标准模型（0.05 元/次，复杂多行方程组明显更准）；turbo = 轻量模型（0.04 元/次）
        model: standard
        # B 模式：全局热键。截图后不用切回 DSH，直接按这个键就把公式插进 Word。
        # 写成空字符串 '' 可关闭热键常驻进程；被其它软件占用时换一个（如 Ctrl+Alt+M）。
        hotkey: 'Ctrl+Alt+F'